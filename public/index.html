<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f0e">
  <title>사진 찍기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app" data-step="camera">
    <!-- 1. 촬영 -->
    <section class="step step-camera" aria-label="촬영">
      <div class="stage">
        <video id="video" class="cropped" autoplay playsinline muted></video>
        <p id="camera-msg" class="stage-msg" hidden></p>
        <div id="countdown" class="countdown" role="timer" aria-live="assertive" hidden>
          <span id="countdown-num" class="countdown-num"></span>
        </div>
        <div id="flash" class="flash"></div>
      </div>
      <div class="topbar">
        <button id="timer-btn" class="pill" type="button" data-lock></button>
      </div>
      <div class="controls">
        <div id="filters" class="chips" role="radiogroup" aria-label="필터"></div>
        <div class="bar bar-camera">
          <span aria-hidden="true"></span>
          <button id="shutter" class="shutter" type="button" aria-label="촬영" disabled></button>
          <button id="flip" class="icon-btn" type="button" aria-label="카메라 전환" data-lock>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/>
              <path d="M4 4v4h4"/>
              <path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/>
              <path d="M20 20v-4h-4"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- 2. 확인 -->
    <section class="step step-review" aria-label="사진 확인">
      <div class="stage">
        <img id="preview" alt="방금 찍은 사진">
      </div>
      <div class="controls">
        <p id="review-msg" class="msg" role="status"></p>
        <div class="bar bar-pair">
          <button id="retake" class="btn" type="button">다시 찍기</button>
          <button id="save" class="btn primary" type="button">이 사진으로 저장</button>
        </div>
      </div>
    </section>

    <!-- 3. 받기 -->
    <section class="step step-done" aria-label="사진 받기">
      <div class="done">
        <img id="qr" class="qr" alt="다운로드 페이지 QR 코드">
        <h1>QR을 찍어 사진을 받으세요</h1>
        <p class="sub">휴대폰 카메라로 비추면 바로 열려요.</p>
        <a id="page-link" class="link" target="_blank" rel="noopener"></a>
        <div class="bar bar-stack">
          <a id="download" class="btn primary" download>이 기기에 저장</a>
          <button id="again" class="btn quiet" type="button">새로 찍기</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
