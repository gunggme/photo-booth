<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>사진 받기</title>
  <meta name="theme-color" content="#0e0f0e">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="photo-page">
    <div id="found" hidden>
      <img id="photo" class="photo" alt="받을 사진">
      <a id="download" class="btn primary wide" download>사진 저장</a>
      <p class="hint">저장이 안 되면 사진을 길게 눌러 저장하세요.</p>
    </div>
    <div id="missing" hidden>
      <h1>사진을 찾을 수 없어요</h1>
      <p class="hint">주소가 잘못됐거나 사진이 삭제됐어요.</p>
    </div>
  </main>
  <script type="module">
    const id = location.pathname.split('/').pop();
    const res = await fetch(`/api/photos/${id}`).catch(() => null);
    if (res?.ok) {
      document.getElementById('photo').src = `/api/photos/${id}/file`;
      document.getElementById('download').href = `/api/photos/${id}/download`;
      document.getElementById('found').hidden = false;
    } else {
      document.getElementById('missing').hidden = false;
    }
  </script>
</body>
</html>
